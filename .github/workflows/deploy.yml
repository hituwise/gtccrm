name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing! Add VERCEL_TOKEN in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying using VERCEL_ORG_ID and VERCEL_PROJECT_ID..."
            npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --yes vercel build --prod --token="$VERCEL_TOKEN"
            npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            echo "Deploying directly via Vercel CLI..."
            npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes
          fi
